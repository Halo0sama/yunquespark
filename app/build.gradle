plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.halo.yunquespark'
    compileSdk 36

    defaultConfig {
        applicationId "com.halo.yunquespark"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        // API key 不入库：从根目录 local.properties 读 yunque.ai_key（见 README）
        def localProps = new Properties()
        def lpFile = rootProject.file("local.properties")
        if (lpFile.exists()) lpFile.withInputStream { localProps.load(it) }
        def aiKey = localProps.getProperty("yunque.ai_key") ?: ""
        buildConfigField "String", "DEFAULT_AI_KEY", "\"${aiKey}\""
        buildConfigField "String", "AI_BASE_URL", '"https://api.deepseek.com/anthropic"'
        buildConfigField "String", "AI_MODEL_FAST", '"deepseek-v4-flash"'
        buildConfigField "String", "AI_MODEL_PRO", '"deepseek-v4-pro"'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    lint {
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
